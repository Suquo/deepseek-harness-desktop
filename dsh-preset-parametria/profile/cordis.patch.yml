# The Parametria profile's own patch layer, applied after every bundle layer
# (`@deepseek-ai/dsh-base` then `@deepseek-ai/dsh-web-app`) and before the
# home-level `cordis.patch.yml`, which outranks it.
#
# AN ID-TARGETED PATCH REPLACES THE NAMED ENTRY'S WHOLE `config`. There is no
# deep merge, so every field kept from the bundle layer is restated below and
# `tests/profile-patch.test.mjs` asserts that restatement against the pinned
# upstream bundle rather than trusting this comment.

# ── the preset the profile boots on ─────────────────────────────────────────
#
# `dsh-web-app` sets `default: standard`; this is the whole config, so naming
# `default` alone restates it completely. `includeUserRoot` is the plugin's own
# schema default and stays true, which is what makes `$DSH_HOME/.agent-presets`
# a scanned root — the installer puts the `parametria` preset directory there,
# so no `roots` entry is needed and the deployment's read-only shipped install
# is never touched.
#
# `default` is the roster's fallback, not a lock: a session may still select
# another preset, and switching is refused only once its agent has produced
# something (`agent-preset-locked`).
- id: agent-presets
  config:
    default: parametria

# ── the validator's model route (issue #1's structural half) ────────────────
#
# `dsh-base` mounts `llm-pi-ai` DORMANT with no config at all, so replacing the
# whole config costs nothing. The adapter merges this composition base with the
# user's `llm-pi-ai:` settings section PER PROVIDER, so the operator's own
# `openrouter` route keeps serving the session model untouched while this one
# is added beside it.
#
# WHY A SEPARATE HAND-DECLARED ROUTE rather than a `modelOverrides` entry on
# `openrouter`: the operator's `openrouter` route is their session-model route,
# live in `$DSH_HOME/settings.yaml` and rewritten by the web Models page. A
# validator whose vision guarantee rode that route would inherit every edit
# made to it. `parametria-vision` is owned by this profile and by nothing else.
#
# `input: [text, image]` is the load-bearing declaration, per the owner ruling.
# Modalities resolve entry `input` -> installed catalog entry -> route
# `defaultInput` (default `[text]`). `assertImageCapableRoute` resolves the
# calling agent's route and refuses an image read outright unless that list
# includes `image`, so this is what lets the validator open a screenshot at all
# — the gate itself is upstream's and is already fail-closed. The pinned
# catalog happens to declare `[text, image]` for this model already; stating it
# here means a future upstream pin that narrows or drops the entry cannot
# silently strip vision from the validator.
#
# The values below are the pinned catalog's own (`openrouter.json`, upstream
# dsh-v0.1.0-rc.7): a hand-declared route inherits nothing, so an unstated
# capacity would fall back to the route defaults (262,144 / 32,768) and quietly
# shrink the model. `tests/vision-route.test.mjs` diffs every one of them
# against that catalog file, so a pin bump that changes the model's real shape
# fails the gate.
- id: llm-pi-ai
  config:
    providers:
      parametria-vision:
        displayName: Parametria vision (OpenRouter)
        # A credential REFERENCE, resolved per request through `ctx.credentials`;
        # no secret enters this file. Discovered read-only from the operator's
        # live `$DSH_HOME/settings.yaml`, which names the same variable for
        # their own OpenRouter route.
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        # pi-ai guesses the reasoning dialect from the endpoint URL; this URL
        # would guess right, but a route that states its dialect keeps working
        # if the endpoint is ever repointed at a proxy.
        compat:
          thinkingFormat: openrouter
        models:
          - id: google/gemini-3.6-flash
            name: 'Google: Gemini 3.6 Flash'
            contextWindow: 1048576
            maxTokens: 65536
            input:
              - text
              - image
            # Key = the level selectors offer, value = its wire spelling. A
            # hand-declared model that declares none does not reason at all,
            # which would silently downgrade a model the catalog marks
            # reasoning-capable. `off:` is valueless on purpose: it offers Off
            # and sends nothing.
            reasoningEfforts:
              off:
              high: high

# ── the run's own permission preset (issue #9 item 1) ───────────────────────
#
# WHAT THE LIVE RUN DID, and why this row exists. Export `dsh-session-853a0bc2`
# (the first Parametria profile run) hit three sandbox refusals under the
# composed `workspace-write` default and the operator answered by typing
# `/permission danger-full-access` mid-run (L197). That shipped preset does not
# only unconfine the filesystem — it bundles `approval: never`, whose own
# context contribution reads "Approval prompts are disabled in this session:
# actions that require approval are rejected automatically — do not request
# sandbox escalation (do not set `sandbox_permissions`)". So the one control
# that could have kept the widening down to a single command was switched off
# by the same keystroke that widened everything. `parametria-capture` is that
# same file access with the approval channel LEFT ON.
#
# WHY A WIDER MODE IS UNAVOIDABLE AT ALL — a documented mechanism plus one
# inference, kept apart on purpose. Under `workspace-write` on win32 the
# sandbox seam resolves to the ACL restricted-token runner, and THAT BACKEND
# DOCUMENTS a hard boundary: piped stdio uses NAMED pipes, whose Win32 default
# security descriptor denies the client-end open a write no restricting SID
# carries, so "a confined process cannot capture a grandchild's output through
# a pipe; tools that must capture output cannot run confined" — while
# `inherit` and `ignore` spawns are explicitly fine
# (`deepseek-harness/packages/sandbox/sandbox-windows-acl/README.md`).
#
# THE INFERENCE is that the skill's `screenshot-definition.py` is that shape:
# nothing upstream says Playwright's sync API spawns its driver with piped
# stdio. What says so is the live call, which died in
# `asyncio/windows_utils.py` `Popen.__init__` with `PermissionError(13, 'Access
# is denied')` — classified by the tool layer as a sandbox denial with the
# escalation hint attached (seq 201) — and every screenshot call after the
# switch succeeding (seq 215 onward). Read that as one datum rather than a
# proof of mechanism: what is certain is that this command failed confined and
# succeeded unconfined on this host.
#
# No writable-root grant could have fixed it under either reading, because this
# seam HAS no such grant: `SandboxMode` is a file-effect vocabulary of exactly
# three values and `dsh-sandbox-policy` documents "extra writable roots are not
# part of `SandboxExecutionPolicy`".
#
# WHAT THIS ROW IS NOT. It is a table entry, not a default: `defaultPreset` is
# deliberately absent below, so the profile still boots sessions on the
# composed `workspace-write` + `ask` pair, and this preset costs nothing until
# a human selects it. The narrowest path stays the per-call one — the model
# retrying one denied command with `sandbox_permissions` + `justification`,
# which the persona now names — and this row is the whole-run alternative for a
# capture-heavy session, not a replacement for it. Redefining the shipped
# `danger-full-access` entry instead was rejected: an operator who types a
# shipped preset's name must get the meaning that name has everywhere else.
#
# HOW THE SELECTION IS RELEASED, since selecting it IS a durable claim on full
# file access. Two releases, both upstream's: within the session,
# `/permissionPresets workspace-write` switches back (the selection is a
# log-only event and the last one wins); across sessions there is nothing to
# release, because a preset selection is pinned into the session that made it
# and a new session starts from `defaultPreset` instead — which this patch
# leaves at the composed `workspace-write`. What neither release covers is a
# long session that never switches back, so the entry's `description` says to,
# and the persona asks the model to say so once the capture phase ends.
#
# An id-targeted patch REPLACES the whole config, so all three shipped presets
# are restated verbatim; `tests/profile-patch.test.mjs` diffs that restatement
# against the pinned bundle in BOTH directions and pins the one added entry.
# Declaration ORDER is load-bearing beyond readability: with no recorded
# selection to prefer — which is exactly the state the inferred default is
# computed in — `derive()` falls to a FIRST-match scan of the table, so an
# entry placed above `workspace-write` and sharing its (sandbox, approval) pair
# would capture that default. The fence asserts exactly one entry matches it.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      # `name`/`description` are optional and the shipped rows omit them, so
      # the picker renders their bare keys. This entry states both anyway: it
      # is the one entry a run tells the operator to select MID-RUN, and
      # "parametria-capture" alone does not say that the thing being selected
      # is full file access.
      parametria-capture:
        sandbox: danger-full-access
        approval: ask
        name: parametria-capture
        description: Full file access for the Parametria screenshot pass, with approval prompts still enabled. Switch back to workspace-write when the capture phase ends.

# The session's own default model is deliberately NOT patched here.
#
# `dsh-base` leaves it at `deepseek-official`/`deepseek-v4-flash` — text-only,
# which is exactly the first-run configuration where the blind validator was
# found. Pinning a vision model for the session would hide whether the
# validator's own pin works, and issue #1's acceptance criterion is precisely
# "a run whose MAIN model is text-only still produces subagent image reads that
# succeed". A saved user selection outranks this row anyway, so pinning it
# would change nothing for the operator and would cost the profile its
# demonstration. Revisit only if issue #1 closes on different evidence.
