# The Parametria profile's own patch layer, applied after every bundle layer
# (`@deepseek-ai/dsh-base` then `@deepseek-ai/dsh-web-app`) and before the
# home-level `cordis.patch.yml`, which outranks it.
#
# AN ID-TARGETED PATCH REPLACES THE NAMED ENTRY'S WHOLE `config`. There is no
# deep merge, so every field kept from the bundle layer is restated below and
# `tests/profile-patch.test.mjs` asserts that restatement against the pinned
# upstream bundle rather than trusting this comment.
#
# The validator's `parametria-vision` route is deliberately NOT here. It lives
# in this package's `machine/cordis.patch.yml`, which the installer merges into
# the operator's machine-wide `$DSH_HOME/cordis.patch.yml`, because the preset
# that pins it is itself machine-wide — see that file's header, and issue #1. A
# copy here would be outranked by the home layer anyway, so it could only ever
# drift into a lie; `tests/profile-patch.test.mjs` fails if one reappears.

# ── the preset the profile boots on ─────────────────────────────────────────
#
# `dsh-web-app` sets `default: standard`; this is the whole config, so naming
# `default` alone restates it completely. `includeUserRoot` is the plugin's own
# schema default and stays true, which is what makes `$DSH_HOME/.agent-presets`
# a scanned root — the installer puts the `parametria` preset directory there,
# so no `roots` entry is needed and the deployment's read-only shipped install
# is never touched.
#
# `default` is the roster's fallback, not a lock: a session may still select
# another preset, and switching is refused only once its agent has produced
# something (`agent-preset-locked`).
- id: agent-presets
  config:
    default: parametria

# The session's own default model is deliberately NOT patched here.
#
# `dsh-base` leaves it at `deepseek-official`/`deepseek-v4-flash` — text-only,
# which is exactly the first-run configuration where the blind validator was
# found. Pinning a vision model for the session would hide whether the
# validator's own pin works, and issue #1's acceptance criterion is precisely
# "a run whose MAIN model is text-only still produces subagent image reads that
# succeed". A saved user selection outranks this row anyway, so pinning it
# would change nothing for the operator and would cost the profile its
# demonstration. Revisit only if issue #1 closes on different evidence.

# ── optional product subagent providers (Codex, Claude Code) ────────────────
#
# Mounted once on the HOST plane, exactly as the desktop profile mounts them.
# TWO reasons, and the first is load-bearing for the validator:
#
# 1. The preset's `subagent_validator` row denies `subagent_codex` and
#    `subagent_claude_code` by name, and `tools.restrict()` THROWS on a name
#    that never registered — so in a profile without these providers the
#    delegation tools never appear, the deny list hits unknown names, and
#    EVERY validator spawn dies with a config error (the 2026-08-28 run lost
#    its entire finalization validation to exactly this). Upstream is explicit
#    that a preset cannot provide this host dependency ("install the matching
#    Bundle in the Profile and restart"): the PROFILE must mount what the
#    preset's deny list names.
# 2. They are the product subagents the preset's `tool-subagent-codex` /
#    `tool-subagent-claude-code` rows expose — vision-capable delegate CLIs
#    available to the agent as ordinary tools.
#
# The packages are declared in this profile's `package.json` (pinned to the
# same 0.1.1-rc.2 the desktop profile runs); each registers a dormant provider
# at mount and spawns its pinned package-local CLI only when called.
- insert:
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'

    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
