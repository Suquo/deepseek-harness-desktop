# The `parametria` agent preset: the shipped `standard` coding agent, plus the
# three things a Suquo Systems Parametria run needs and a hand-arranged session
# cannot guarantee.
#
# 1. A PRESET-LOCAL SKILL ROOT (`skills/` beside this file). The skill travels
#    with the preset and registers into THIS preset's layer of the host skill
#    registry, where the nearest layer wins duplicates outright. The directory
#    ships EMPTY on purpose: an empty or absent root discovers nothing, so the
#    operator's existing `~/.agents/skills/suquo-systems-parametria` copy keeps
#    resolving unchanged until issue #7 migrates the canonical copy in here.
#    Seeding a placeholder would SHADOW the real skill, which is a regression.
#
# 2. A VISION-PINNED VALIDATOR DELEGATE (`subagent_validator`). See its row.
#
# 3. A persona that states the run's own shape rather than the generic one.
#
# Everything else is `standard` copied unchanged, which is the documented way
# to author a preset (the shipped install belongs to the deployment and an
# upgrade overwrites it). `tests/preset-drift.test.mjs` is an exhaustive
# two-direction diff against the pinned upstream `standard` preset, so a row
# that appears, disappears, or changes shape upstream fails the gate here
# instead of drifting silently.
#
# A service row in a preset MUST sit inside a group carrying an `isolate`
# realm, or `dsh-agent-presets` rejects the mount. The two groups below carry
# the same realms `standard` gives them, for the same reasons.

# ── identity ────────────────────────────────────────────────────────────────

# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness Desktop. Your working directory is {{cwd}}.

      This session runs the Parametria work profile: you build and verify parametric millwork definitions in Suquo Systems Parametria through the `suquo-systems-parametria` skill. Load that skill before building anything; it owns the node catalog, the definition schema, and the screenshot and verification procedure.

      Delegate every visual check to `subagent_validator`, never to `subagent`. The validator delegate is pinned to a route that declares image input, so it can actually read a screenshot. A general `subagent` child inherits this session's model instead: if that model is text-only, every image read is REFUSED — and the child still returns a summary, which is how a validation pass that never saw anything comes back reading like a clean one. Delegating a visual check to `subagent` is therefore an error even though nothing crashes.

      If a `subagent_validator` result reports refused image reads, treat the run as unvalidated and say so. Never restate a child's conclusion about an image the child could not open.

      Where this run's files go. Every artifact the run produces — the screenshots, the spec JSON you dump or generate, and any generator script you write to get past a long command line — belongs under `.parametria-evidence/` in the working directory. Resolve the run's own directory ONCE, before you write the first artifact of any kind: `.parametria-evidence/$env:DSH_SESSION_ID/` in PowerShell, `.parametria-evidence/$DSH_SESSION_ID/` under bash. Create it, and check that the session-id segment actually expanded — if it came out empty, put a timestamp there instead, because one `.parametria-evidence/` shared by every run is how a validator reads the previous run's screenshot and passes this one. Then pass ABSOLUTE paths built from that directory to every command and to every `subagent_validator` prompt. A delegate runs under its own session id, so a path it derives for itself is not the path you wrote to — state the full path in the prompt and have the delegate use exactly that one; and if you ARE the delegate and were handed absolute paths, use them verbatim and derive nothing. A generator script you write must itself write its output to absolute paths under that same directory: a bare filename inside a script resolves against the working directory rather than the script's own folder, which is how a `spec.json` ended up loose in a user's repository even though the script that wrote it sat in the right place. The skill's own examples write to `C:/tmp/...` and `/tmp/...`; ignore both. Each is an absolute path outside the session workspace, which the standing `workspace-write` policy does not grant. The working directory is granted under that policy and under anything wider, so one run directory serves the confined commands and the capture tool alike. Never leave an artifact loose in the working directory's root: that directory is usually a repository the user is working in, and a run that scatters PNGs and scratch scripts through it leaves the user to clean up after it.

      Two shell facts about this host, so you do not rediscover them by trial. Set `$env:UV_CACHE_DIR = "$PWD\.uv-cache"` before every `uv run`: the default cache under `%LOCALAPPDATA%` and an arbitrary absolute path such as `C:\tmp` are both outside what the standing `workspace-write` policy grants, so uv cannot initialise its cache there and fails before the script starts. Temp is writable, but only the private directory the sandbox rewrites `$env:TEMP` to — never a path that merely looks temporary. A workspace-local cache needs no wider access at all and survives between sessions in the same workspace. Second, the skill's Playwright screenshot script has never run confined on this host: it spawns its browser driver as a child with piped stdio, and a confined process cannot open that pipe — the failure arrives as a Python `PermissionError` traceback ending in `Access is denied`, whatever directory the screenshot itself is written to, so relocating the output does not help. That is what the `parametria_capture` tool is for, and it is how you take every screenshot: it runs that same script from outside the sandbox, so it needs no approval and no escalation. Give it a definition id and a bare `.png` file name; it writes into this run's evidence directory and returns the absolute path to read. Never shell out to the screenshot script yourself, and never ask for a wider sandbox in order to take a picture. That tool is also the ONLY capture path a delegate has: approval prompts are switched off inside a delegated session, so a subagent that asked to escalate would be refused automatically with nothing left to try — if a validator needs its own capture, it calls `parametria_capture` too. Should some OTHER command ever be refused by the sandbox with no workspace-local answer, retry that exact command once with `sandbox_permissions: danger-full-access` — the only wider mode above the standing `workspace-write` — plus a `justification` naming what that command needs. Ask once per command, every time. Do NOT ask the user to widen the whole session instead: the session-wide full-access preset also switches approval prompts off, and a run that can no longer ask is a run whose next refusal has nowhere to go. Never spend an escalation on the uv cache either: it has a workspace-local answer.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: a host row that injects a service
# is the criterion for host-plane ownership — injection resolves before any
# session exists, so there is no agent to key by. Both shell tools consume the
# host registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── the capture capability (issue #24) ─────────────────────────────────────
#
# The one row that is not a shipped upstream tool. It exists because the
# skill's Playwright capture CANNOT run under the standing `workspace-write`
# policy on this host, at any price: a confined process cannot open the named
# pipe Playwright's driver spawn needs, which upstream documents verbatim
# (`packages/sandbox/sandbox-windows-acl/README.md:99` — "tools that must
# capture output cannot run confined"), and the failing CreateNamedPipeW is
# Python's, inside the child, so no patch of ours can reach it.
#
# WHY THE ROW SITS HERE rather than in the machine patch that carries the
# vision route. Both would work — a host-level tool row IS inherited by a
# preset-composed agent (`core/tools/src/index.ts:1161` seeds the global layer
# into every scope's view) — but a machine-wide row would put this tool in
# EVERY profile's roster, including sessions that will never open Parametria.
# The preset is itself machine-wide, so mounting the capability beside the
# persona that teaches it keeps the blast radius at "runs that asked for it"
# and makes the two impossible to install apart. The route in
# `machine/cordis.patch.yml` had to go the other way for the opposite reason:
# it is a dormant provider block, not a roster entry.
#
# The script path is deliberately absent. This file is version-controlled and
# installed machine-wide, so a literal here would ship one machine's path to
# every machine; the operator sets `DSH_PARAMETRIA_CAPTURE_SCRIPT` once
# instead, and the tool refuses BY NAME while it is unset. Issue #7's
# canonicalization ruling will change what that defaults to, not how it is
# spelled.
#
# Registers into the host `tools` registry and provides no service, so like the
# rows above it needs no realm.
- id: parametria-capture
  name: dsh-plugin-desktop/parametria-capture

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
#
# `customSkillDirs` is the one edit against `standard`. `baseUrl` is this
# preset's own directory, so the root resolves wherever the preset is
# installed — the installer copies `skills/` along with this file. Discovery
# rank 300 puts it above `$DSH_HOME/skills` and the bundled roots and below a
# project's own `.dsh/`/`.agents/` dirs, but rank only breaks ties WITHIN one
# layer: this preset's layer is nearer than the deployment's, so once issue #7
# lands the migrated skill here it wins outright over the home-directory copy.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime. The section text is `standard`'s
# verbatim; the drift fence compares it byte for byte.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It keys every fold by
# Session and owns the context-meter projection units the browser reads for
# every session — behind a realm those units would come and go with whichever
# presets happen to be mounted. A Parametria run is long and image-heavy, so
# this preset keeps `standard`'s compaction stack rather than thinning it.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here.
#
# `tool-subagent-report` stays host-plane: it registers a CONTINUABLE SETUP on
# the singleton rather than a tool this agent calls, and the setup list is not
# scope-aware, so a second agent-plane copy throws on the second live session.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # ── the vision-pinned validator delegate (issue #1) ──────────────────────
    #
    # Child model policy is fixed PER INSTANCE — per-call model selection does
    # not exist — so a validator on another model is another distinctly named
    # tool, which is what this row is. `agentOptions` states the route and
    # model explicitly, and explicit values override what the child would
    # otherwise inherit from this session: a text-only session model no longer
    # decides whether the validator can see.
    #
    # The route is `parametria-vision`, declared with `input: [text, image]` in
    # the MACHINE-WIDE `$DSH_HOME/cordis.patch.yml` (this package's
    # `machine/cordis.patch.yml`), not in any one profile: this preset is
    # home-level and loads under EVERY profile, so its route has to be too.
    # Issue #1 lost two live runs to that asymmetry — children spawned with this
    # exact pin under a profile that could not serve it.
    #
    # What that declaration buys, precisely. Upstream's image gate is already
    # fail-closed and route-agnostic: `assertImageCapableRoute`
    # (`packages/fs/tool-fs/src/read-image.ts`) resolves the calling agent's
    # route and THROWS unless it declares `image`, and `dsh-llm-deepseek`
    # hardcodes `inputModalities: ['text']`. So a validator on a text-only
    # session model does not read a blank image — every read is refused, loudly,
    # per call.
    #
    # The silence is one level up. The child still finishes and still returns a
    # summary, and a summary written around a stack of refusals reads exactly
    # like a passing validation — which is what the first Parametria run
    # produced. This row does not add the refusal; it removes the need for one,
    # by giving the validator a route that can actually open the screenshot
    # regardless of what the session is running. The persona above carries the
    # other half: a refused read means the run is unvalidated, not passed.
    #
    # Under-declaring the modality therefore costs a loud refusal naming the
    # model, and over-declaring costs a mid-turn provider rejection after the
    # message is durable. `tests/vision-route.test.mjs` diffs the declaration
    # against the installed catalog so neither is a silent state.
    #
    # `one-shot`, not `continuable`: a validation pass is a question with an
    # answer, so the parent waits for the verdict in the foreground rather than
    # holding a durable child id it has no follow-up for.
    #
    # `maxDepth` is an ABSOLUTE cap on the CHILD's delegation depth, not a
    # relative "how many further levels" budget. Upstream resolves the child's
    # depth as `delegationDepthOf(parent) + 1` and throws `SubagentDepthError`
    # the moment that exceeds the cap (`resolveChildDepth`,
    # `packages/subagent/subagent/src/child-agent.ts:48-56`); a top-level agent
    # is depth 0 (`depth.ts:28-36`). So the validator this session starts is
    # depth 1, and `dsh-tool-subagent`'s own README says it plainly: default
    # `3`, and `0` forbids delegation entirely.
    #
    # This row shipped `maxDepth: 0` (issue #18), which is exactly that: the
    # persona MANDATES delegating every visual check here, and the harness
    # refused every attempt — `Error: subagent depth 1 exceeds maxDepth 0`,
    # observed live in export `dsh-session-853a0bc2`. `1` is the smallest cap
    # that admits the spawn, and it still refuses a depth-2 child through this
    # same row, so the validator cannot recursively re-enter the vision route.
    #
    # What the cap does NOT reach, stated so nobody re-reads it as more than it
    # is: a cap is enforced per START through the row that carries it. A child
    # joins its parent's preset through `composeFrom()`, so the validator also
    # holds every OTHER delegation row in this file — the sibling `subagent` /
    # `subagent_fork` rows above (no cap, so upstream's default `3`) and the
    # `ralph` / `workflow` rows below, which reach children through
    # `workflow-worker-thread` with no cap requested at all
    # (`packages/workflow/workflow-worker-thread/src/host.ts:352-357`). This
    # row's `maxDepth` touches none of them.
    #
    # CORRECTION (issue #20). This comment previously said a grandchild through
    # those rows would land "on the session model", i.e. that the blind-child
    # hole re-opened one level down. That was WRONG, and the correction is the
    # reason the fix below is what it is. Upstream resolves a child's route
    # from its CALLING agent's live options — `resolveChildAgentOptions`
    # (`child-agent.ts:68-83`) spreads `parent.options.provider/model` and only
    # then the row's own `agentOptions` — and the calling agent for a start made
    # INSIDE the validator is the validator, which runs on the route this row
    # pins (`tool-subagent/src/index.ts:372` takes `exec.agent` as that parent;
    # `subagent-in-process-driver/src/index.ts:136` hands it straight to the
    # resolver; an agent's `options` are the ones it was created with verbatim,
    # `agent-loop/src/agent.ts:83`). So an uncapped grandchild RECURSES AND
    # SPENDS on the paid vision route. It does not go blind.
    #
    # `toolFilter` is what makes both impossible: the validator is a LEAF.
    # Every delegation-starting tool this preset registers is denied to the
    # child, so it cannot start one at any depth, on any route, through any
    # row. Rationale is containment and simplicity — a validation pass is a
    # question with an answer, not an orchestrator — NOT blindness, which was
    # never reachable here.
    #
    # Three properties of `toolFilter` this list is built around:
    #
    # 1. It is applied in the CHILD's creation window, after the preset join —
    #    `applyChildComposition` calls `composeFrom()` and then
    #    `childCtx.tools.restrict(toolFilter)` (`child-agent.ts:163-175`). The
    #    preset's standing mount is therefore an ANCESTOR of the child scope
    #    (`agent-presets/src/index.ts:316-325`), and an ancestor's rows are
    #    exactly what a child may restrict: `view()` exempts only the child's
    #    OWN layer (`core/tools/src/index.ts:1152-1192`), which is what keeps
    #    the delegation runtime's own reporting tools out of the filter.
    #    Upstream fences that shape directly, in a case named "filters tools
    #    the child inherits from an ancestor scope, not only global ones"
    #    (`core/tools/tests/scoped.spec.ts`).
    # 2. A name that is not registered is REJECTED, not ignored:
    #    `tools.restrict()` throws on an unknown global name
    #    (`core/tools/src/index.ts:1088-1092`). That throw lands inside the
    #    child's creation window, so it fails the DELEGATION — every
    #    `subagent_validator` call, the issue #18 failure class again — while
    #    the app and session keep running. Hence: this list names only tools
    #    rows in THIS file actually register and leave ENABLED. The
    #    `subagent_codex` / `subagent_claude_code` rows are enabled in this
    #    preset (the desktop profile mounts both providers on the host plane),
    #    so both names are denied below.
    # 3. `deny`, not `allow`. An allow-list would be a closed enumeration of
    #    every tool the validator is permitted, and every row added upstream
    #    would silently disappear from the child. A deny-list states exactly
    #    the capability being withdrawn.
    #
    # Audited and NOT denied, so the omission reads as a decision: the
    # `tool-subagent-control` rows above (`send_message`, `interrupt_agent`,
    # `list_agents`). They register tools but reach no child-START seam — they
    # act on children a caller already owns, and a one-shot leaf owns none.
    #
    # `tests/validator-leaf.test.mjs` derives this list rather than restating
    # it: it classifies every enabled row against the pinned upstream source
    # (does the package both register a model-facing tool AND reach a child-
    # start seam?) and requires the deny list to equal that set exactly. Each
    # name comes from the nearest DECLARATION, in three steps — the row's own
    # `toolName`, else the package's `toolName` schema default, else the single
    # fixed name in its `defineTool` registration (which is how `ralph`, whose
    # package has no `toolName` config at all, resolves). A delegation row added
    # later and left undenied fails there; so does a denied name this preset
    # does not register.
    - id: tool-subagent-validator
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_validator
        backgroundMode: one-shot
        maxDepth: 1
        toolFilter:
          deny:
            - subagent
            - subagent_fork
            - subagent_validator
            - subagent_codex
            - subagent_claude_code
            - ralph
            - workflow
        agentOptions:
          provider: parametria-vision
          model: google/gemini-3.6-flash

    # Optional product subagent providers, mounted on the host plane by the
    # desktop profile patch (`profiles/desktop/cordis.patch.yml`).
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
